const PSG=[];let PSL=0;

function psgPick(f){const ids=PSG.map(p=>p.id).sort(),seen=f.psn||[];let pool=ids.filter(i=>!seen.includes(i));if(!pool.length)return null;return pool[Math.floor(rnd(today()+me.id+'psg')()*pool.length)]}
function psgCard(){if(!PSG.length)return '';const t=today();let d=me.psd&&me.psd.d==t?me.psd:null;if(d&&PSL>=20&&!PSG.find(x=>x.id==d.i))d=null;if(!d){if(PSL<20)return '';const i=psgPick(me);if(!i)return `<div class="card"><h3>📰 오늘의 기술 지문</h3><p>🎉 준비된 지문을 모두 풀었어요!<br><small>새 지문이 올라오면 다시 나와요. 한 번 푼 지문은 다시 나오지 않아요.</small></p></div>`;d={d:t,i,r:[-1,-1]};me.psd=d;DB.upd(me.id,{psd:d})}const p=PSG.find(x=>x.id==d.i);if(!p)return '';const C='①②③④⑤';
 return `<div class="card"><h3>📰 오늘의 기술 지문 <small>${d.r.filter(v=>v>=0).length}/${p.q.length}</small></h3><p><small>${esc(p.f||'기술')} · 하루 1지문 · 문항당 🪙+8 XP+8, 모두 맞히면 보너스 +10!</small></p><b>${esc(p.t)}</b><p style="font-size:14px;line-height:1.7;text-align:justify">${esc(p.p)}</p>${p.q.map((q,qi)=>{const r=d.r[qi];return `<div style="border-top:1px dashed var(--d);padding:8px 0"><b>${qi+1}. ${esc(q.q)}</b>${q.b?`<p style="background:var(--l);border-radius:10px;padding:8px;font-size:13px">${esc(q.b)}</p>`:''}${q.o.map((o,oi)=>`<button class="g" style="display:block;width:100%;text-align:left;margin:4px 0;${r>=0&&oi==q.a?'background:#c9f2c7':''}" onclick="psgAns(${qi},${oi})">${C[oi]} ${esc(o)}</button>`).join('')}${r>=0?`<p>${r?'🎉 정답!':'😢 정답은 '+C[q.a]+'번'}<br><small>${esc(q.e)}</small></p>`:''}</div>`}).join('')}</div>`}
async function psgAns(qi,oi){const f=await DB.get(me.id),t=today(),d=f.psd&&f.psd.d==t?f.psd:null;if(!d)return;const p=PSG.find(x=>x.id==d.i);if(!p||d.r[qi]>=0)return;const ok=p.q[qi].a==oi;d.r[qi]=ok?1:0;const done=d.r.every(v=>v>=0),all=d.r.every(v=>v==1),m=(ok?8:2)+(all?10:0),u={psd:d};if(!(f.psn||[]).includes(d.i))u.psn=[...(f.psn||[]),d.i];
 await DB.upd(me.id,u);await DB.inc(me.id,{money:m,xp:m});mark(f,m);if(ok&&d.r.filter(v=>v==1).length==1)cgAdd(1);toast(`📰 ${ok?'정답!':'아쉬워요'} 🪙+${m} XP+${m}`+(all?' 🎉 모두 정답 보너스!':''));await load()}
